name: Secrets

# Scans every commit of every branch for credentials with gitleaks, on each pull request and on main. The repository
# is public, so a leaked token is exposed the moment it is pushed; this and GitHub's push protection both guard it.
# Fake test values are allowlisted by exact value in .gitleaks.toml.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Renovate updates these two together (renovate.json, customManagers): the release tag, and the sha256 of its
  # linux_x64 tarball as listed in the release's checksums.txt.
  GITLEAKS_VERSION: v8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          curl -sSLfo "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the history
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --log-opts="--all" .

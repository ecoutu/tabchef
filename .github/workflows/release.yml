name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

# One release at a time; never cancel a release that is mid-flight.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    # The release commit carries [skip ci]; guard here too so it can never re-trigger a release.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      # main is protected by the `protect-main` ruleset, so the CHANGELOG.md / version commit and the tag need a
      # token that may bypass it. With RELEASE_APP_ID set, a GitHub App on the bypass list mints one; otherwise the
      # owner's classic token PROJECT_TOKEN is used (the admin role bypasses protect-main with mode "always").
      - uses: actions/create-github-app-token@v2
        if: ${{ vars.RELEASE_APP_ID != '' }}
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Check the release token
        env:
          TOKEN: ${{ steps.app-token.outputs.token || secrets.PROJECT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::set RELEASE_APP_ID + RELEASE_APP_PRIVATE_KEY, or PROJECT_TOKEN"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.PROJECT_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.PROJECT_TOKEN }}

# The Chrome Web Store upload is not automated yet: upload the release's zip by hand.

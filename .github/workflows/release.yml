name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

# One release at a time; never cancel a release that is mid-flight.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    # The release commit carries [skip ci]; guard here too so it can never re-trigger a release.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    # Replaces the workflow's permissions for this job only, so the reusable ci job never gets id-token.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # The keyless Chrome Web Store credentials (google-github-actions/auth).
      id-token: write
    steps:
      # main is protected by the `protect-main` ruleset, so the CHANGELOG.md / version commit and the tag need a
      # token that may bypass it. With RELEASE_APP_ID set, a GitHub App on the bypass list mints one; otherwise the
      # owner's classic token PROJECT_TOKEN is used (the admin role bypasses protect-main with mode "always").
      - uses: actions/create-github-app-token@v2
        if: ${{ vars.RELEASE_APP_ID != '' }}
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Check the release token
        env:
          TOKEN: ${{ steps.app-token.outputs.token || secrets.PROJECT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::set RELEASE_APP_ID + RELEASE_APP_PRIVATE_KEY, or PROJECT_TOKEN"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.PROJECT_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Keyless store credentials: GitHub's OIDC token for this run (main only) is exchanged through the
      # github-tabchef pool for a one-hour Chrome Web Store access token as cws-publisher (ecoutu-infra). Skipped until
      # the CHROME_WIF_PROVIDER variable is set.
      - uses: google-github-actions/auth@v3
        id: cws
        if: ${{ vars.CHROME_WIF_PROVIDER != '' }}
        with:
          workload_identity_provider: ${{ vars.CHROME_WIF_PROVIDER }}
          service_account: ${{ vars.CHROME_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          # The token is enough; no credentials file is written into the workspace.
          create_credentials_file: false
      # After the GitHub release, scripts/submit-stores.sh uploads the zip to the Chrome Web Store and submits it for
      # review. Without the access token it skips, and the release is on GitHub only.
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.PROJECT_TOKEN }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_ACCESS_TOKEN: ${{ steps.cws.outputs.access_token }}

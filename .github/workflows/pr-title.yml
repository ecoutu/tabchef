name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check the PR title is a Conventional Commit
        env:
          # Passed via env, never interpolated into the script (injection).
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|refactor|test|docs|build|ci|chore|style|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ "$PR_TITLE" =~ $re ]]; then
            echo "OK: $PR_TITLE"
          else
            echo "::error::PR title must be a Conventional Commit, e.g. 'fix(scope): summary'. It becomes the squash commit title that semantic-release reads. Got: $PR_TITLE"
            exit 1
          fi

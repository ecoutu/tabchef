name: CI

on:
  pull_request:
  # No push trigger: on every push to main, Release runs this workflow as its `ci` job before releasing.
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:cycles
      - run: npm run check:terms
      - run: npm run check:contrast
      - run: npm run validate:recipes
      - run: npm run check
      # npm test includes the Vitest browser project (tests/browser), which runs in Playwright's bundled Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm run check:csp
      - run: npm run check:secrets

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Bundled Chromium in new headless mode loads unpacked extensions; no xvfb needed.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # M3 mocked-services spec: its own build with WXT_E2E_LOCALHOST=1 (localhost host permission, M3-R86).
      - run: npm run e2e:m3
      # Also after a pass: a test that failed and then passed on retry (CI retries once) left its trace here. Only
      # diagnostics: a failed upload must not fail the job (or the release that calls it).
      - name: Upload the failed tests' traces
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          # e2e:m3 writes to its own folder (playwright.config.ts outputDir).
          path: |
            test-results/
            test-results-m3/
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true

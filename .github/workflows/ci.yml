name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:cycles
      - run: npm run validate:recipes
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run check:csp

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Bundled Chromium in new headless mode loads unpacked extensions; no xvfb needed.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

name: Validate store credentials

# Checks the keyless Chrome Web Store credentials without uploading anything: that this run can federate into
# cws-publisher (ecoutu-infra: the github-tabchef pool) and that the store accepts it for the item. Run it from main,
# the only branch the pool admits, after changing the repository variables or the store's service account.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run zip
      - name: Check the variables are set
        env:
          WIF: ${{ vars.CHROME_WIF_PROVIDER }}
          SA: ${{ vars.CHROME_SERVICE_ACCOUNT }}
          ITEM: ${{ vars.CHROME_EXTENSION_ID }}
          PUBLISHER: ${{ vars.CHROME_PUBLISHER_ID }}
        run: |
          for v in WIF SA ITEM PUBLISHER; do
            if [ -z "${!v}" ]; then echo "::error::set the CHROME_WIF_PROVIDER, CHROME_SERVICE_ACCOUNT, CHROME_EXTENSION_ID and CHROME_PUBLISHER_ID repository variables"; exit 1; fi
          done
      # Keyless store credentials: GitHub's OIDC token for this run (main only) is exchanged through the
      # github-tabchef pool for a one-hour Chrome Web Store access token as cws-publisher (ecoutu-infra).
      - uses: google-github-actions/auth@v3
        id: cws
        with:
          workload_identity_provider: ${{ vars.CHROME_WIF_PROVIDER }}
          service_account: ${{ vars.CHROME_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          # The token is enough; no credentials file is written into the workspace.
          create_credentials_file: false
      - run: scripts/submit-stores.sh --dry-run
        env:
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_ACCESS_TOKEN: ${{ steps.cws.outputs.access_token }}

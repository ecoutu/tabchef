# Jira ticket (by PR title or branch), M3 T16: one project per Jira issue key. A Jira ticket tab creates the
# project (key from the URL); a GitHub pull request tab joins it when its title names the key, else when its head
# branch does (assignProject.fallbackKey: M2's `default:` filter takes a literal, not a template). The
# branch needs the GitHub connection or github.com access; the title works at every level. One of the three
# jira-ticket-* variants can be enabled at a time (conflicts).
# The ticket rule's needs end with an empty alternative: without the Jira connection or host access it still runs at
# the Titles level (key from the URL, summary from the title). A PR's key creates no project on its own unless its
# prefix is confirmed (projectPrefixes, or a key the Jira API answered for): Review Focus #5.
recipe: jira-ticket-either
version: 1
name: Jira ticket projects (PR title or branch)
description: Groups each Jira ticket tab with the GitHub pull requests whose title or branch names its key, one group per ticket.
params:
  jiraSite:
    type: string
    default: '*.atlassian.net'
    label: Jira site
    help: The host name of your Jira site, e.g. acme.atlassian.net. The default matches every Jira Cloud site.
  keyPattern:
    type: regex
    default: '[A-Z][A-Z0-9]+-\d+'
    label: Issue key pattern
    help: A regular expression for an issue key, e.g. [A-Z][A-Z0-9]+-\d+ for ABC-123.
  projectPrefixes:
    type: string[]
    default: []
    label: Your Jira project keys
    help: One per line, e.g. ABC. When set, only keys with these prefixes count, and a pull request with such a key starts a project even without its ticket tab open. Empty means any key whose ticket tab is open. A prefix is also confirmed by a known Jira project key (a ticket the Jira connection answered for, once Jira is connected) or by an open ticket tab.
  ignoredPrefixes:
    type: string[]
    default: [UTF, ISO, SHA, RFC, CVE, GPT, COVID, HTTP, TLS, SSL, MD, AES, RSA, ES, PEP, WCAG, IPV, X86, ARM, CP, KB, JSR]
    label: Prefixes that are never keys
    help: One per line. Text like UTF-8 or SHA-256 looks like an issue key but is not. Not used when Your Jira project keys is set.
  titleFormat:
    type: string
    default: '{key}'
    enum: ['{key}', '{key} · {summary}']
    label: Group title
    help: "{key} shows the issue key (ABC-123); {key} · {summary} adds the ticket's summary once it is known."
  color:
    type: string
    default: blue
    enum: [grey, blue, red, yellow, green, pink, purple, cyan, orange]
    label: Group color
    help: The color of each ticket's tab group.
  githubOrgs:
    type: string[]
    default: []
    label: GitHub organizations to search for linked pull requests
    help: One per line. With the GitHub connection, the Projects tab lists pull requests that mention the key in these organizations (and those of the project's open pull requests). Empty searches pull requests involving you.
  boardPopups:
    type: boolean
    default: false
    label: Group a board when it shows a ticket
    help: When on, a Jira board with a ticket open in its popup (?selectedIssue= in its address) joins that ticket's group while the popup is open, and leaves it when you close the popup. When off, only the ticket's own page joins.
project: {key: '{key}', title: '{params.titleFormat}', color: '{params.color}', container: group, join: [rules, manual]}
conflicts: [jira-ticket-title, jira-ticket-branch]
# A ticket's /browse/<KEY> page opened with Jira's own query or fragment (?atlOrigin= from a shared link,
# ?focusedCommentId= from a notification) is the same tab as the ticket (#179). {params.jiraSite} right after :// renders
# as a host glob (with its context path, if any) and the match ignores case, so the fold covers the same sites as the
# ticket rule when jiraSite is *.<host> or a host (with an optional :port and path); any other * in it (mid-host, a
# port or path wildcard, a bare *) drops the fold. A board's ?selectedIssue= page is never folded into the ticket: it
# stays its own tab. The ticket rule joins it to the ticket's project only with boardPopups on (#194, off by default);
# otherwise the board would move into the ticket's group when a ticket's popup opens and back out when it closes.
# On any other page of the site, Jira's atlOrigin tracking param (a shared link's) is dropped, so a shared board link
# is the open board (Jira strips it with history.replaceState, too late for a new tab). The key's params are sorted;
# the first transform drops it when another param follows, the second when it ends the query.
dedupe:
  urlTransforms:
    - pattern: '^(https?://{params.jiraSite}/browse/[A-Za-z][A-Za-z0-9_]*-\d+)/?(?:[?#].*)?$'
      replacement: '$1'
      flags: i
    - pattern: '^(https?://{params.jiraSite}/[^?#]*\?(?:[^#]*&)?)atlOrigin=[^&#]*&'
      replacement: '$1'
      flags: i
    - pattern: '^(https?://{params.jiraSite}/[^?#]*)(?:\?atlOrigin=[^&#]*|(\?[^#]*)&atlOrigin=[^&#]*)(?=#|$)'
      replacement: '$1$2'
      flags: i
rules:
  - id: ticket
    name: Ticket tab
    enabled: true
    needs:
      anyOf:
        - connections: [jira]
        - hosts: ['https://{params.jiraSite}/*']
        - {}
    source:
      connection: jira
      query: jira.issue
      args: {key: '{key}'}
      fields: {status: status, statusCategory: statusCategory, summary: summary}
      fallback: {adapter: jira.issuePage}
    match:
      any:
        - url: '{params.jiraSite}/browse/*'
        - all:
            - url: '{params.jiraSite}/*selectedIssue=*'
            - field: {field: params.boardPopups, op: '==', value: true}
    extract:
      key: {from: url, jiraKey: {pattern: '{params.keyPattern}', allow: '{params.projectPrefixes}', ignore: '{params.ignoredPrefixes}'}}
      summary: {from: title, regex: '^\[[^\]]+\]\s*(?<s>.+?)\s*-\s*Jira$', group: s}
    actions:
      - assignProject: {key: '{key}', create: true}
  - id: pr
    name: PR by title or branch
    enabled: true
    needs:
      anyOf:
        - connections: [github]
        - hosts: ['https://github.com/*']
        - {}
    source:
      connection: github
      query: github.pull_request
      args: {owner: '{owner}', repo: '{repo}', number: '{num}'}
      fields: {headRefName: headRefName, state: state}
      fallback: {adapter: github.prPage}
    match:
      url: 'github.com/:owner/:repo/pull/:num*'
    extract:
      keyTitle: {from: title, jiraKey: {pattern: '{params.keyPattern}', allow: '{params.projectPrefixes}', ignore: '{params.ignoredPrefixes}'}}
      keyBranch: {from: source.headRefName, jiraKey: {pattern: '{params.keyPattern}', allow: '{params.projectPrefixes}', ignore: '{params.ignoredPrefixes}'}}
    actions:
      - assignProject: {key: '{keyTitle}', fallbackKey: '{keyBranch}'}
levels:
  - {id: titles, label: Titles, rules: [ticket, pr]}
  - {id: page, label: Page details, rules: [ticket, pr]}
  - {id: connections, label: Connections, rules: [ticket, pr]}
views:
  - {id: projects, tab: Projects, kind: projects, actions: []}

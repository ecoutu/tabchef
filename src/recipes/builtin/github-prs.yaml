# GitHub pull requests: a PR's sub-pages (files, commits, checks) de-duplicate to the PR itself.
# Replaces M1's built-in `githubPr` canonicalizer (M2 T6). The pattern is anchored to the github.com host, as M1
# checked the hostname exactly; the query is kept (strip params such as `w` with dedupe.stripParams).
recipe: github-prs
version: 1
name: GitHub pull requests
description: Treats a pull request's Files, Commits and Checks pages as the same tab as the pull request.
dedupe:
  urlTransforms:
    - pattern: '^(https?://github\.com/[^/?#]+/[^/?#]+/pull/\d+)(?:/(?:files|commits|checks)(?:/[^?#]*)?)?/?(?=[?#]|$)'
      replacement: '$1'
rules:
  - id: group-by-repo
    name: Group GitHub tabs by repository
    enabled: false
    match:
      all:
        - url: 'github.com/:owner/:repo*'
        # GitHub's own pages (settings, orgs, notifications, ...) have two path segments but are not a repository.
        - not:
            url:
              - 'github.com/settings/*'
              - 'github.com/notifications/*'
              - 'github.com/orgs/*'
              - 'github.com/organizations/*'
              - 'github.com/marketplace/*'
              - 'github.com/sponsors/*'
              - 'github.com/topics/*'
              - 'github.com/trending/*'
              - 'github.com/codespaces/*'
              - 'github.com/features/*'
              - 'github.com/apps/*'
              - 'github.com/enterprise/*'
              - 'github.com/enterprises/*'
              - 'github.com/collections/*'
              - 'github.com/pulls/*'
              - 'github.com/issues/*'
              - 'github.com/account/*'
              - 'github.com/users/*'
              - 'github.com/login/*'
              - 'github.com/logout/*'
              - 'github.com/sessions/*'
              - 'github.com/signup/*'
              - 'github.com/search/*'
              - 'github.com/new/*'
              - 'github.com/explore/*'
              - 'github.com/dashboard/*'
              - 'github.com/stars/*'
              - 'github.com/watching/*'
              - 'github.com/site/*'
              - 'github.com/security/*'
              - 'github.com/about/*'
              - 'github.com/readme/*'
              - 'github.com/events/*'
              - 'github.com/customer-stories/*'
              - 'github.com/pricing/*'
              - 'github.com/team/*'
              - 'github.com/copilot/*'
              - 'github.com/github-copilot/*'
              - 'github.com/models/*'
              - 'github.com/contact/*'
              - 'github.com/discussions/*'
              - 'github.com/downloads/*'
              - 'github.com/redeem/*'
              - 'github.com/join/*'
              - 'github.com/auth/*'
              - 'github.com/password_reset/*'
              - 'github.com/showcases/*'
              - 'github.com/solutions/*'
              - 'github.com/resources/*'
              - 'github.com/nonprofit/*'
              - 'github.com/mobile/*'
    actions:
      - group:
          title: '{repo}'
          color: grey
          merge: true
